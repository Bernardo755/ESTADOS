<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Estados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ==================== PANTALLA DE LOGIN ==================== -->
    <div id="loginSection" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/60 p-8 max-w-sm w-full backdrop-blur-md">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-[#1e5b4f]/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-[#1e5b4f]/50">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Acceso Restringido</h2>
                <p class="text-slate-400 text-sm mt-1">Ingresa tus credenciales para continuar</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Usuario</label>
                    <input type="text" id="loginUser" required class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="loginPass" required class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none transition-all">
                </div>
                
                <button type="submit" id="btnLogin" class="w-full bg-[#1e5b4f] hover:bg-[#16483e] text-white font-bold py-3 rounded-xl shadow-lg transition-all duration-200 mt-2 flex justify-center items-center gap-2">
                    <span>Iniciar Sesión</span>
                </button>
                <div id="loginSpinner" class="hidden text-center mt-2">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-emerald-400 mx-auto"></div>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== APLICACIÓN PRINCIPAL (Oculta inicialmente) ==================== -->
    <div id="mainApp" class="hidden flex-col min-h-screen">
        <header class="bg-gradient-to-r from-[#1e5b4f] via-slate-900 to-[#123831] border-b border-slate-800 py-6 px-8 shadow-xl">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        Sistema de Consulta
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Búsqueda de registros - <span id="userRoleBadge" class="text-emerald-400 font-bold"></span></p>
                </div>
                <button id="btnLogout" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg border border-slate-600 transition-colors">Cerrar Sesión</button>
            </div>
        </header>

        <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
            <!-- Formulario de Búsqueda -->
            <section class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 p-6 mb-8 backdrop-blur-md">
                <h2 class="text-lg font-semibold mb-5 text-emerald-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#1e5b4f]"></span> Filtros de Búsqueda
                </h2>
                
                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-start">
                    <!-- 1. Criterio Principal -->
                    <details class="group bg-slate-900/50 border border-slate-600 rounded-xl overflow-hidden shadow-sm" open>
                        <summary class="px-4 py-3.5 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between items-center cursor-pointer hover:bg-slate-800 list-none">
                            Criterio Principal <span class="text-red-400">*</span>
                            <svg class="w-4 h-4 text-emerald-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </summary>
                        <div class="px-4 pb-4 pt-2 border-t border-slate-700">
                            <div class="flex rounded-xl overflow-hidden border border-slate-600 bg-slate-900 focus-within:ring-2 focus-within:ring-[#1e5b4f]">
                                <select id="searchType" class="bg-slate-800 text-slate-200 px-2 py-2.5 border-r border-slate-600 text-xs focus:outline-none">
                                    <option value="curp">CURP</option>
                                    <option value="id">ID</option>
                                </select>
                                <input type="text" id="searchValue" placeholder="Requerido..." class="w-full px-3 py-2.5 bg-transparent text-white placeholder-slate-500 focus:outline-none uppercase text-sm">
                            </div>
                        </div>
                    </details>

                    <!-- 2. Estado -->
                    <details class="group bg-slate-900/50 border border-slate-600 rounded-xl overflow-hidden shadow-sm">
                        <summary class="px-4 py-3.5 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between items-center cursor-pointer hover:bg-slate-800 list-none">
                            Filtro: Estado
                            <svg class="w-4 h-4 text-emerald-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </summary>
                        <div class="px-4 pb-4 pt-2 border-t border-slate-700">
                            <input type="text" id="estado" placeholder="Ej. Hidalgo" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white focus:outline-none text-sm">
                        </div>
                    </details>

                    <!-- 3. CCT -->
                    <details class="group bg-slate-900/50 border border-slate-600 rounded-xl overflow-hidden shadow-sm">
                        <summary class="px-4 py-3.5 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between items-center cursor-pointer hover:bg-slate-800 list-none">
                            Filtro: CCT
                            <svg class="w-4 h-4 text-emerald-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </summary>
                        <div class="px-4 pb-4 pt-2 border-t border-slate-700">
                            <input type="text" id="cct" placeholder="Ej. 13DPR..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white uppercase focus:outline-none text-sm">
                        </div>
                    </details>

                    <!-- 4. Libro -->
                    <details class="group bg-slate-900/50 border border-slate-600 rounded-xl overflow-hidden shadow-sm">
                        <summary class="px-4 py-3.5 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between items-center cursor-pointer hover:bg-slate-800 list-none">
                            Libro de Búsqueda
                            <svg class="w-4 h-4 text-emerald-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </summary>
                        <div class="px-4 pb-4 pt-2 border-t border-slate-700">
                            <select id="searchScope" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white text-sm focus:outline-none">
                                <option value="TODOS">Todos los libros</option>
                                <option value="JEF">JEF (Libro del Script)</option>
                                <option value="EMS">EMS (1er ID)</option>
                                <option value="GB">GB (2do ID)</option>
                                <option value="BASICA">BASICA (3er ID en adelante)</option>
                            </select>
                        </div>
                    </details>

                    <div class="lg:col-span-4 flex justify-end pt-4 mt-2 border-t border-slate-700/60">
                        <button type="submit" class="bg-[#1e5b4f] hover:bg-[#16483e] text-white font-medium px-8 py-3 rounded-xl shadow-lg transition-all text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <span>Ejecutar Búsqueda</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Spinner de Carga -->
            <div id="loading" class="hidden flex flex-col items-center justify-center py-16">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-400 mb-4"></div>
                <p class="text-slate-400 text-sm tracking-wide">Procesando solicitud...</p>
            </div>

            <!-- Resultados -->
            <section id="resultsSection" class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 p-6 hidden">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                    <h2 class="text-lg font-semibold text-slate-200">Resultados Encontrados</h2>
                    <span id="resultCount" class="bg-[#1e5b4f]/30 text-emerald-300 border border-[#1e5b4f]/50 text-xs font-semibold px-3 py-1 rounded-full">0 resultados</span>
                </div>
                <div class="overflow-x-auto max-h-[650px] border border-slate-700 rounded-xl">
                    <table id="resultsTable" class="w-full text-left border-collapse">
                        <thead id="tableHeader" class="bg-slate-900/90 sticky top-0 text-xs text-slate-400 uppercase font-semibold tracking-wider backdrop-blur-sm"></thead>
                        <tbody id="tableBody" class="divide-y divide-slate-700/60 text-sm text-slate-300"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- SCRIPT LOGICA -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby5_uLLcGkZnx2aZsW_zeAQiKgwumR8hrWl91jHLRUXZJB735s8t2rDu7kZRcWBUEIZcQ/exec"; // <-- PEGA TU URL DE APPS SCRIPT AQUI

        // --- Lógica de Login ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            document.getElementById('btnLogin').classList.add('hidden');
            document.getElementById('loginSpinner').classList.remove('hidden');

            try {
                // Se envía el parametro action=login
                const response = await fetch(`${WEB_APP_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('mainApp').classList.add('flex');
                    document.getElementById('userRoleBadge').textContent = `Rol: ${data.role}`;
                } else {
                    alert("⛔ Acceso denegado: " + data.message);
                }
            } catch (error) {
                alert("Error de conexión. Verifica la URL del Script.");
            } finally {
                document.getElementById('btnLogin').classList.remove('hidden');
                document.getElementById('loginSpinner').classList.add('hidden');
            }
        });

        // Logout
        document.getElementById('btnLogout').addEventListener('click', () => {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('flex');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('resultsSection').classList.add('hidden');
        });

        // --- Lógica de Búsqueda con Validaciones ---
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const searchType = document.getElementById('searchType').value;
            const searchValue = document.getElementById('searchValue').value.trim();
            const estado = document.getElementById('estado').value.trim();
            const cct = document.getElementById('cct').value.trim();
            const searchScope = document.getElementById('searchScope').value;

            // REGLA 1: No buscar nada si el campo de CURP/ID está vacío
            if (!searchValue) {
                alert("⚠️ Debes ingresar obligatoriamente una CURP o un ID para realizar la búsqueda.");
                return;
            }

            // REGLA 2: Validación estricta para CURP (Exactamente 18 caracteres alfanuméricos)
            if (searchType === "curp") {
                const curpRegex = /^[A-Za-z0-9]{18}$/;
                if (!curpRegex.test(searchValue)) {
                    alert("⚠️ Formato incorrecto: La CURP debe tener exactamente 18 caracteres entre letras y números.");
                    return;
                }
            }

            // REGLA 3: Validación estricta para ID (Mínimo 5 números)
            if (searchType === "id") {
                const idRegex = /^[0-9]{5,}$/; // Solo números, 5 o más
                if (!idRegex.test(searchValue)) {
                    alert("⚠️ Formato incorrecto: El ID debe contener al menos 5 números exclusivamente.");
                    return;
                }
            }

            // Flujo normal de búsqueda
            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            
            loading.classList.remove('hidden');
            resultsSection.classList.add('hidden');

            try {
                // Se envía action=search
                const url = `${WEB_APP_URL}?action=search&type=${searchType}&value=${encodeURIComponent(searchValue)}&estado=${encodeURIComponent(estado)}&cct=${encodeURIComponent(cct)}&scope=${searchScope}`;
                const response = await fetch(url);
                const data = await response.json();

                loading.classList.add('hidden');
                resultsSection.classList.remove('hidden');

                if (data.status === "success" && data.results.length > 0) {
                    document.getElementById('resultCount').textContent = `${data.results.length} resultado(s)`;
                    
                    let headerHtml = '<tr><th class="p-4 border-b border-slate-700 text-emerald-400">Origen</th><th class="p-4 border-b border-slate-700 text-emerald-400">Hoja</th>';
                    data.results[0].headers.forEach(h => headerHtml += `<th class="p-4 border-b border-slate-700">${h || 'Col'}</th>`);
                    headerHtml += '</tr>';
                    document.getElementById('tableHeader').innerHTML = headerHtml;

                    let bodyHtml = '';
                    data.results.forEach(res => {
                        let badgeClass = "bg-slate-700 text-slate-300";
                        if (res.source === "JEF") badgeClass = "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                        else if (res.source === "EMS") badgeClass = "bg-blue-500/20 text-blue-300 border border-blue-500/30";
                        else if (res.source === "GB") badgeClass = "bg-amber-500/20 text-amber-300 border border-amber-500/30";
                        else if (res.source === "BASICA") badgeClass = "bg-purple-500/20 text-purple-300 border border-purple-500/30";

                        bodyHtml += `<tr class="hover:bg-slate-700/40">`;
                        bodyHtml += `<td class="p-4 border-b border-slate-700/65"><span class="px-2.5 py-1 rounded-md text-xs font-bold ${badgeClass}">${res.source}</span></td>`;
                        bodyHtml += `<td class="p-4 border-b border-slate-700/65 text-slate-400 text-xs">${res.sheetName}</td>`;
                        res.values.forEach(cell => bodyHtml += `<td class="p-4 border-b border-slate-700/65 whitespace-nowrap">${cell !== null && cell !== undefined ? cell : ''}</td>`);
                        bodyHtml += '</tr>';
                    });
                    document.getElementById('tableBody').innerHTML = bodyHtml;
                } else {
                    document.getElementById('resultCount').textContent = "0 resultados";
                    document.getElementById('tableHeader').innerHTML = '';
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" class="p-8 text-center text-slate-500">No se encontraron registros.</td></tr>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert("Ocurrió un error en la búsqueda.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
