<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Estados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #resultsSection { -webkit-user-select: none; user-select: none; }
    @media print { body { display: none !important; } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-gradient-to-r from-[#1e5b4f] via-slate-900 to-[#123831] border-b border-slate-800 py-6 px-8 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Sistema de Consulta</h1>
        <p class="text-slate-400 text-sm mt-1">Búsqueda rápida y jerárquica de registros</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-slate-800/80 border border-slate-700 px-4 py-2 rounded-xl text-xs text-slate-300">
          <span id="searchCounterBadge" class="font-bold text-emerald-400"></span>
        </div>
        <button id="btnLogout" type="button" class="text-xs bg-slate-800 border border-slate-700 hover:bg-slate-700 px-3 py-2 rounded-xl">Salir</button>
      </div>
    </div>
  </header>

  <!-- Contenido oculto hasta validar sesión -->
  <main id="main" class="hidden flex-grow container mx-auto px-4 py-8 max-w-7xl">
    <section class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 p-6 mb-8">
      <h2 class="text-lg font-semibold mb-5 text-emerald-400">Filtros de Búsqueda</h2>
      <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Criterio Principal *</label>
          <div class="flex rounded-xl border border-slate-600 bg-slate-900 overflow-hidden focus-within:ring-2 focus-within:ring-[#1e5b4f]">
            <select id="searchType" class="bg-slate-800 text-slate-200 px-3 py-2.5 border-r border-slate-600 text-xs font-medium focus:outline-none cursor-pointer">
              <option value="curp">CURP</option>
              <option value="id">ID</option>
            </select>
            <input type="text" id="searchValue" autocomplete="off" placeholder="Valor (Obligatorio)..." class="w-full px-3 py-2.5 bg-transparent text-white placeholder-slate-500 focus:outline-none uppercase text-sm">
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <label for="estado" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Estado <span class="text-emerald-500/80 lowercase tracking-normal">(Acelera búsqueda)</span></label>
          <input type="text" id="estado" autocomplete="off" placeholder="Ej. 13" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none uppercase text-sm">
        </div>
        <div class="flex flex-col gap-2">
          <label for="cct" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">CCT <span class="text-emerald-500/80 lowercase tracking-normal">(Acelera búsqueda)</span></label>
          <input type="text" id="cct" autocomplete="off" placeholder="Ej. 13DPR..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none uppercase text-sm">
        </div>
        <div class="flex flex-col gap-2">
          <label for="searchScope" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">NIVEL</label>
          <select id="searchScope" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white text-sm focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none cursor-pointer">
            <option value="TODOS">Todos los niveles</option>
            <option value="BASICA">BASICA</option>
            <option value="EMS">EMS</option>
            <option value="JEF">JEF</option>
            <option value="GB">GB</option>
          </select>
        </div>
        <div class="lg:col-span-4 flex justify-end pt-2 mt-2 border-t border-slate-700/60">
          <button type="submit" class="bg-[#1e5b4f] hover:bg-[#16483e] text-white font-medium px-8 py-3 rounded-xl shadow-lg transition-all text-sm">Ejecutar Búsqueda Rápida</button>
        </div>
      </form>
    </section>

    <div id="loading" class="hidden flex flex-col items-center justify-center py-16">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-400 mb-4"></div>
      <p class="text-slate-400 text-sm tracking-wide">Analizando bases de datos...</p>
    </div>

    <section id="resultsSection" class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 p-6 hidden">
      <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
        <h2 class="text-lg font-semibold text-slate-200">Resultados Encontrados</h2>
        <span id="resultCount" class="bg-[#1e5b4f]/30 text-emerald-300 border border-[#1e5b4f]/50 text-xs font-semibold px-3 py-1 rounded-full"></span>
      </div>
      <div id="tableContainer" class="max-h-[650px] overflow-y-auto"></div>
    </section>
  </main>

  <!-- Login obligatorio -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
      <h3 class="text-xl font-bold text-emerald-400 mb-2">Verificación de Seguridad</h3>
      <p id="modalTexto" class="text-slate-400 text-xs mb-6">Ingresa tus credenciales para continuar.</p>
      <form id="loginForm" class="flex flex-col gap-4" autocomplete="off">
        <div>
          <label class="text-xs font-semibold text-slate-300 uppercase">Usuario *</label>
          <input type="text" id="modalUsuario" required autocomplete="username" class="w-full mt-1 px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 uppercase">Contraseña *</label>
          <input type="password" id="modalPassword" required autocomplete="current-password" placeholder="••••••••" class="w-full mt-1 px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-[#1e5b4f] focus:outline-none text-sm">
        </div>
        <div id="loginError" class="hidden text-xs p-3 rounded-lg border"></div>
        <button type="submit" id="btnLoginSubmit" class="mt-2 w-full bg-[#1e5b4f] hover:bg-[#16483e] text-white font-medium py-3 rounded-xl shadow-lg text-sm">Validar y Continuar</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
