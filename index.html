<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Masivo de Registros</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-6 px-8">
        <h1 class="text-2xl font-bold">Sistema de Consulta Masiva</h1>
        <p class="text-blue-100 text-sm">Búsqueda optimizada en múltiples libros de Google Sheets</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- Formulario de Búsqueda -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Filtros de Búsqueda</h2>
            <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- CURP (Columna B) -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-1">CURP (Col. B)</label>
                    <input type="text" id="curp" placeholder="Ej. ABCD123456..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>

                <!-- ID (Columna C) -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-1">ID (Col. C)</label>
                    <input type="text" id="idVal" placeholder="Ej. 987654" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Estado (Columna A - Acotador) -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Estado (Col. A)</label>
                    <input type="text" id="estado" placeholder="Ej. Hidalgo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- CCT (Columna F - Acotador) -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-1">CCT (Col. F)</label>
                    <input type="text" id="cct" placeholder="Ej. 13DPR..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>

                <!-- Botón de Envío -->
                <div class="lg:col-span-4 flex justify-end mt-2">
                    <button type="submit" id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors flex items-center gap-2">
                        <span>Buscar Registros</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Spinner de Carga -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500 text-sm">Consultando más de 1,000,000 de registros en los libros...</p>
        </div>

        <!-- Visualizador de Resultados -->
        <section id="resultsSection" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Resultados Encontrados</h2>
                <span id="resultCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 resultados</span>
            </div>
            
            <div class="overflow-x-auto max-h-[600px] border border-slate-200 rounded-lg">
                <table id="resultsTable" class="w-full text-left border-collapse">
                    <thead id="tableHeader" class="bg-slate-100 sticky top-0 text-xs text-slate-600 uppercase font-semibold">
                        <!-- Generado dinámicamente -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm text-slate-700">
                        <!-- Generado dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Script de Conexión -->
    <script>
        // PEGA AQUÍ LA URL DE TU WEB APP DE GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxC1uGW8mLnsHpOwTOL7p2prpoJdfp20csNT1FKHNCgVhU2Tf1zQDkQgOXFoHiq6kXsww/exec";

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const curp = document.getElementById('curp').value.trim();
            const idVal = document.getElementById('idVal').value.trim();
            const estado = document.getElementById('estado').value.trim();
            const cct = document.getElementById('cct').value.trim();

            if (!curp && !idVal && !estado && !cct) {
                alert("Por favor, introduce al menos un criterio de búsqueda.");
                return;
            }

            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            const resultCount = document.getElementById('resultCount');

            loading.classList.remove('hidden');
            resultsSection.classList.add('hidden');

            try {
                const response = await fetch(`${WEB_APP_URL}?curp=${encodeURIComponent(curp)}&id=${encodeURIComponent(idVal)}&estado=${encodeURIComponent(estado)}&cct=${encodeURIComponent(cct)}`);
                const data = await response.json();

                loading.classList.add('hidden');
                resultsSection.classList.remove('hidden');

                if (data.status === "success" && data.results.length > 0) {
                    resultCount.textContent = `${data.results.length} resultado(s)`;
                    
                    // Construir cabeceras dinámicas basadas en la primera fila encontrada
                    const maxColumns = Math.max(...data.results.map(r => r.length));
                    let headerHtml = '<tr><th class="p-3 border-b">Libro / Hoja</th>';
                    for (let i = 0; i < maxColumns; i++) {
                        headerHtml += `<th class="p-3 border-b">Col. ${String.fromCharCode(65 + i)}</th>`;
                    }
                    headerHtml += '</tr>';
                    tableHeader.innerHTML = headerHtml;

                    // Construir filas
                    let bodyHtml = '';
                    data.results.forEach(row => {
                        bodyHtml += '<tr class="hover:bg-slate-50">';
                        // Mostramos la fuente de origen (Libro/Hoja) si viene adjunta o simulamos las celdas
                        row.forEach((cell, index) => {
                            bodyHtml += `<td class="p-3 border-b whitespace-nowrap">${cell !== null && cell !== undefined ? cell : ''}</td>`;
                        });
                        bodyHtml += '</tr>';
                    });
                    tableBody.innerHTML = bodyHtml;

                } else {
                    resultCount.textContent = "0 resultados";
                    tableHeader.innerHTML = '';
                    tableBody.innerHTML = '<tr><td colspan="10" class="p-6 text-center text-slate-400">No se encontraron registros que coincidan con los criterios.</td></tr>';
                }

            } catch (error) {
                loading.classList.add('hidden');
                alert("Ocurrió un error al conectar con el servidor de hojas de cálculo.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
